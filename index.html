<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社楽安 | 公式ホームページ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ Pro W3', 'Hiragino Kaku Gothic Pro', メイリオ, Meiryo, sans-serif;
        }
        body {
            color: #333;
            line-height: 1.6;
            background-color: #f8f9fa;
        }
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.4rem;
            color: #2b3a4a;
        }
        .hero {
            background-color: #2b3a4a;
            color: #ffffff;
            text-align: center;
            padding: 4rem 1rem;
        }
        .hero h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .section {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        .section h3 {
            font-size: 1.4rem;
            color: #2b3a4a;
            border-bottom: 2px solid #2b3a4a;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        th {
            width: 30%;
            color: #6c757d;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>株式会社楽安</h1>
    </header>

    <section class="hero">
        <h2>安心と信頼をお届けする</h2>
        <p>株式会社楽安の公式ウェブサイトです。</p>
    </section>

    <div class="container">
        <section class="section">
            <h3>事業内容</h3>
            <p>株式会社楽安は、大工工事・石膏ボード工事を中心に、内装工事やリフォーム工事を手掛けています。お客様のご要望に合わせ、高品質な施工と丁寧な対応で、安全・安心な住まいづくりをサポートいたします。</p>
        </section>

        <section class="section">
            <h3>会社概要</h3>
            <table>
                <tr>
                    <th>会社名</th>
                    <td>株式会社楽安</td>
                </tr>
                <tr>
                    <th>代表者</th>
                    <td>代表取締役 福田元　（フクダ　ゲン）</td>
                </tr>
                <tr>
                    <th>所在地</th>
                    <td>〒289-1143 千葉県八街市八街い１３９番地５５</td>
                </tr>
                <tr>
                    <th>設立</th>
                    <td>2026年6月1日</td>
                </tr>
            </table>
        </section>
    </div>

    <footer>
        <p>&copy; Rakuan, Inc. All Rights Reserved.</p>
    </footer>

</body>
</html>
